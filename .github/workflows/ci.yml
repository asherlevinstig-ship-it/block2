name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Quality gate (lint, format, unit tests, audit)
        run: npm run check
      - name: Integration test (live two-client room)
        run: npm run test:integration

  browser-e2e:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
        env:
          # ubuntu-latest has no hardware GPU; Chromium's software renderer
          # settles near 6 FPS for this WebGL scene even when idle. Keep the
          # local/device defaults strict (65ms absolute, +15ms from idle), and
          # gate this stable runner class against its calibrated p95 envelope.
          TERRAIN_MAX_FRAME_P95_MS: 220
          TERRAIN_MAX_FRAME_P95_DELTA_MS: 35
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
