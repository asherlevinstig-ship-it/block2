name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Quality gate (lint, format, unit tests, audit)
        run: npm run check
      - name: Integration test (live two-client room)
        run: npm run test:integration

  browser-e2e:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
        env:
          # Shared software-rendered runners are substantially slower than a
          # player device. These still gate measured update+render work (not
          # requestAnimationFrame scheduling delay); local defaults stay 65/15/16.
          TERRAIN_MAX_FRAME_P95_MS: 180
          TERRAIN_MAX_CHUNK_BUILD_P95_MS: 20
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  performance:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Server simulation and bandwidth budgets
        run: npm run test:perf
      - name: Static delivery budgets
        run: npm run test:perf:assets
      - name: Sixteen-player browser work budgets
        run: npm run test:perf:client
        env:
          # Shared software rendering can schedule frames slowly, so CI gates
          # measured update/render work while local runs retain a 28 FPS floor.
          CLIENT_PERF_MIN_FPS: 5
          CLIENT_PERF_MAX_UPDATE_MS: 20
          CLIENT_PERF_MAX_RENDER_MS: 20
