<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blockcraft - Register</title>
<style>
  :root{color-scheme:dark;--bg:#081018;--panel:#111a24;--line:#2b8eb8;--text:#edf7ff;--muted:#9fb6c6;--good:#9bd86b;--bad:#ff8b8b}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(180deg,rgba(2,5,10,.35),rgba(2,5,10,.9)),radial-gradient(circle at 52% 30%,rgba(79,216,255,.16),transparent 36%),url('/assets/bggame.png') center/cover no-repeat;font-family:Georgia,"Times New Roman",serif;color:var(--text)}
  main{width:min(94vw,560px);max-height:calc(100vh - 36px);overflow:auto;border:2px solid rgba(79,216,255,.65);border-radius:10px;background:linear-gradient(180deg,rgba(9,17,26,.86),rgba(5,10,18,.96));box-shadow:0 28px 80px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.06);padding:clamp(22px,4vw,38px);backdrop-filter:blur(8px)}
  h1{margin:0 0 8px;text-align:center;letter-spacing:clamp(4px,1vw,8px);color:#9bd86b;text-shadow:0 3px #31551d;font-size:clamp(29px,6vw,36px)}
  p{margin:0 0 clamp(18px,3vw,24px);text-align:center;color:var(--muted);letter-spacing:1px;line-height:1.45}
  label{display:block;margin:14px 0 6px;color:#cfe9f8;font-size:13px;letter-spacing:2px;text-transform:uppercase}
  input,select{width:100%;height:clamp(46px,7vw,52px);border:1px solid var(--line);border-radius:5px;background:rgba(7,17,27,.88);color:var(--text);padding:0 14px;font:16px Georgia,"Times New Roman",serif;outline:none}
  input:focus,select:focus{border-color:#88e8ff;box-shadow:0 0 0 3px rgba(79,216,255,.18)}
  button{width:100%;height:54px;margin-top:22px;border:0;border-radius:6px;background:#5f963d;color:#fff;font:700 16px Georgia,"Times New Roman",serif;letter-spacing:3px;cursor:pointer}
  button:disabled{opacity:.55;cursor:wait}
  .links{display:flex;justify-content:space-between;gap:14px;margin-top:18px;font-size:14px}
  a{color:#8bdfff;text-decoration:none}
  #status{min-height:22px;margin-top:16px;text-align:center;color:var(--muted)}
  #status.good{color:var(--good)}#status.bad{color:var(--bad)}
  .password-wrap{position:relative}
  .password-wrap input{padding-right:76px}
  .password-toggle{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:auto;height:34px;margin:0;padding:0 10px;border:1px solid rgba(139,223,255,.55);background:rgba(10,27,43,.88);font-size:11px;letter-spacing:1px}
  @media(max-width:520px){body{padding:10px}main{width:100%;max-height:calc(100vh - 20px)}.links{display:grid;gap:10px;text-align:center}}
</style>
</head>
<body>
<main>
  <h1>BLOCKCRAFT</h1>
  <p>Create your school login. We will find your school from your email address.</p>
  <form id="registerForm">
    <label for="email">School email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="yearGroup">Year group</label>
    <select id="yearGroup" name="yearGroup" required>
      <option value="">Select year group</option>
      <option>Year 3</option><option>Year 4</option><option>Year 5</option><option>Year 6</option>
      <option>Year 7</option><option>Year 8</option><option>Year 9</option><option>Year 10</option>
      <option>Year 11</option><option>Year 12</option><option>Year 13</option>
    </select>
    <label for="password">Password</label>
    <div class="password-wrap">
      <input id="password" name="password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required>
      <button id="passwordToggle" class="password-toggle" type="button" aria-controls="password" aria-pressed="false">SHOW</button>
    </div>
    <button id="submitBtn" type="submit">CREATE ACCOUNT</button>
  </form>
  <div id="status" role="status" aria-live="polite"></div>
  <div class="links"><a href="/">Back to game</a><a href="/?login=1">I already have an account</a></div>
</main>
<script type="module" src="./register.js"></script>
</body>
</html>
