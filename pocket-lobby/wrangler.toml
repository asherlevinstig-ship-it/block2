name = "block2"
compatibility_date = "2026-09-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
main = "../worker/index.js"

[triggers]
crons = ["*/5 * * * *"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/game", "/game/*", "/api/player/*", "/api/account/*", "/api/world/*"]
[[d1_databases]]
binding = "TOWER_DB"
database_name = "tower-beginnings-players"
database_id = "394c79bf-90af-4e76-8e62-b6261e6911b5"
migrations_dir = "migrations"

[observability.logs]
enabled = true
invocation_logs = false

[[durable_objects.bindings]]
name = "SHARED_ROOMS"
class_name = "SharedRoom"

[[migrations]]
tag = "tower-shared-rooms-v1"
new_sqlite_classes = ["SharedRoom"]

[[durable_objects.bindings]]
name = "AUTO_ACTORS"
class_name = "AutoActor"

[[migrations]]
tag = "tower-auto-actors-v1"
new_sqlite_classes = ["AutoActor"]

[[durable_objects.bindings]]
name = "AUTO_DIRECTOR"
class_name = "AutoDirector"

[[migrations]]
tag = "tower-auto-recovery-v1"
new_sqlite_classes = ["AutoDirector"]
